  <g id="text_36">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #557080" transform="translate(7.2 460.419039)">Only previously verified same-boundary precincts; areas with at least 8 precincts and 100 finalist votes each. Parentheses show number of precincts.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #557080" transform="translate(7.2 471.2215)">Weighted variation is more comparable than raw maximum–minimum range, but is descriptive, not a causal ranking.</text>
