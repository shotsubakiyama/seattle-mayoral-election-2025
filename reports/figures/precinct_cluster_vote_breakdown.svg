   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5e7384" transform="translate(27.738625 489.394883)">Names are informal locator labels from the two leading community reporting areas; groups are not legal election districts.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #5e7384" transform="translate(27.738625 500.197344)">Vote shares are computed from official 2025 mayoral votes in all grouped precincts.</text>
  </g>
 </g>
