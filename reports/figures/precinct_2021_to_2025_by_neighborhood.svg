  <g id="text_36">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #587282" transform="translate(7.2 413.731094)">Six largest and six smallest area-level declines among areas with at least 8 comparable precincts. Area changes are weighted by 2025 finalist votes.</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #587282" transform="translate(7.2 424.6455)">Harrell faced Lorena González in 2021 and Katie Wilson in 2025, so this is geographic change—not individual voter switching.</text>
  </g>
