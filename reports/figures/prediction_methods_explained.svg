<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" role="img" aria-label="Three approaches: use August vote share directly; fit an August voting model using other precincts; add Census clues."><style>text{font-family:Arial,sans-serif;fill:#223447}.title{font-size:22px;font-weight:bold}.head{font-size:17px;font-weight:bold}.body{font-size:15px}.note{font-size:13px;fill:#607486}</style><rect width="1020" height="360" fill="white"/><text x="28" y="38" class="title">Three ways to estimate November, starting with August</text><text x="28" y="66" class="note">Illustrative precinct: Harrell won 55% of August votes cast for Harrell or Wilson</text><g><rect x="25" y="98" width="300" height="188" rx="9" fill="#f0f4f7"/><rect x="359" y="98" width="300" height="188" rx="9" fill="#eaf3f8"/><rect x="693" y="98" width="300" height="188" rx="9" fill="#f9f1e8"/></g><text x="45" y="128" class="head">1  Copy August</text><text x="379" y="128" class="head">2  Learn from other precincts</text><text x="713" y="128" class="head">3  Add Census context</text><text x="45" y="175" style="font-size:36px;font-weight:bold">55%</text><text x="45" y="207" class="body">Predict the same share</text><text x="45" y="229" class="body">in November.</text><text x="379" y="174" class="body">August vote shares</text><text x="379" y="196" class="body">+ patterns learned from</text><text x="379" y="218" class="body">other precincts.</text><text x="713" y="174" class="body">August model + density,</text><text x="713" y="196" class="body">voting-age fraction, and</text><text x="713" y="218" class="body">occupied housing share.</text><text x="28" y="325" class="note">All three are evaluated against actual November results. The fitted models train on other geographic groups, not the precinct being tested.</text></svg>