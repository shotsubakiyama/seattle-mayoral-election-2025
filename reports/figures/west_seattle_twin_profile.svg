<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 646" role="img" aria-label="Matched West Seattle precincts: earlier voting and Census measures versus divergent November results">
<style>text{font-family:Arial,sans-serif;fill:#24384b}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#607386}.head{font-size:15px;font-weight:700}.label{font-size:15px}.detail{font-size:16px;font-weight:600}.big{font-size:30px;font-weight:700}.note{font-size:12px;fill:#5f7386}</style>
<rect width="1040" height="646" fill="white"/>
<text x="28" y="38" class="title">How Python recognized two West Seattle political twins</text>
<text x="28" y="63" class="sub">Matched on history and Census data before looking at November 2025.</text>
<rect x="22" y="91" width="996" height="450" rx="8" fill="#f6f8fa"/>
<text x="34" y="117" class="head">A / WHAT WE MATCHED</text>
<text x="530" y="117" class="head">1246 · Highland Park</text>
<text x="783" y="117" class="head">1464 · Junction–Genesee Hill</text>
<line x1="31" y1="172" x2="1009" y2="172" stroke="#e1e7ed"/>
<text x="34" y="151" class="label">Harrell share in 2021</text>
<text x="530" y="151" class="detail">61.1%</text>
<text x="783" y="151" class="detail">61.9%</text>
<line x1="31" y1="229" x2="1009" y2="229" stroke="#e1e7ed"/>
<text x="34" y="208" class="label">Harrell share in August 2025</text>
<text x="530" y="208" class="detail">49.7%</text>
<text x="783" y="208" class="detail">54.4%</text>
<line x1="31" y1="286" x2="1009" y2="286" stroke="#e1e7ed"/>
<text x="34" y="265" class="label">August votes for other candidates</text>
<text x="530" y="265" class="detail">7.2%</text>
<text x="783" y="265" class="detail">10.1%</text>
<line x1="31" y1="343" x2="1009" y2="343" stroke="#e1e7ed"/>
<text x="34" y="322" class="label">Residents of voting age (2020)</text>
<text x="530" y="322" class="detail">81.1%</text>
<text x="783" y="322" class="detail">80.6%</text>
<line x1="31" y1="400" x2="1009" y2="400" stroke="#e1e7ed"/>
<text x="34" y="379" class="label">Occupied housing units (2020)</text>
<text x="530" y="379" class="detail">96.8%</text>
<text x="783" y="379" class="detail">96.2%</text>
<line x1="31" y1="457" x2="1009" y2="457" stroke="#e1e7ed"/>
<text x="34" y="436" class="label">Population density (2020)</text>
<text x="530" y="436" class="detail">8,126 / sq mi</text>
<text x="783" y="436" class="detail">8,288 / sq mi</text>
<text x="34" y="520" class="note">These are broad similarities, not proof that the residents or voters are identical.</text>
<text x="34" y="574" class="head">B / REVEAL NOVEMBER</text>
<text x="530" y="580" class="big" fill="#2b739d">46.6%</text>
<text x="784" y="580" class="big" fill="#ba6a36">63.9%</text>
<text x="34" y="607" class="head">17.4-percentage-point difference in Harrell&#39;s November share</text>
<text x="34" y="633" class="note">Turnout was 62.4% and 76.6%. Different turnout is a clue, not proof of a cause.</text>
</svg>
