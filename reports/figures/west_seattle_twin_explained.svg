<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-label="Highland Park and Junction-Genesee Hill historical twins: 2021 61.1 vs 61.9 percent; November 2025 46.6 vs 63.9 percent."><style>text{font-family:Arial,sans-serif;fill:#233448}.title{font-size:22px;font-weight:bold}.head{font-size:15px;font-weight:bold}.lab{font-size:14px}.big{font-size:29px;font-weight:bold}.note{font-size:13px;fill:#627487}</style><rect width="1000" height="365" fill="white"/><text x="28" y="35" class="title">Two West Seattle precincts: nearly tied in 2021, far apart in 2025</text><circle cx="40" cy="70" r="7" fill="#31759b"/><text x="55" y="75" class="lab">Highland Park (1246)</text><circle cx="260" cy="70" r="7" fill="#ce7840"/><text x="275" y="75" class="lab">Junction–Genesee Hill (1464)</text><text x="28" y="116" class="head">2021 MAYORAL ELECTION</text><text x="355" y="116" class="head">AUGUST 2025 PRIMARY</text><text x="683" y="116" class="head">NOVEMBER 2025</text><g fill="#f3f6f8"><rect x="25" y="130" width="305" height="166" rx="8"/><rect x="350" y="130" width="305" height="166" rx="8"/><rect x="675" y="130" width="300" height="166" rx="8"/></g><text x="43" y="171" class="big" fill="#31759b">61.1%</text><text x="43" y="211" class="big" fill="#ce7840">61.9%</text><text x="43" y="260" class="note">0.8-point gap</text><text x="368" y="178" style="font-size:30px;font-weight:bold">4.8 points</text><text x="368" y="210" class="lab">apart in August</text><text x="368" y="260" class="note">Both shares among the finalists</text><text x="693" y="171" class="big" fill="#31759b">46.6%</text><text x="693" y="211" class="big" fill="#ce7840">63.9%</text><text x="693" y="260" class="note">17.4-point gap</text><text x="28" y="336" class="note">2021 opponent: Lorena González; 2025 opponent: Katie Wilson. Different electorates; selected descriptive comparison, not voter switching.</text></svg>