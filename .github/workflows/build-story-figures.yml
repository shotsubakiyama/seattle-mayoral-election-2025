name: Validate second-edition election story

on:
  push:
    branches: [feat/reader-friendly-election-story]
    paths:
      - .github/workflows/build-story-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify analysis and generate explanatory charts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis packages
        run: python -m pip install -r requirements-analysis.txt
      - name: Rebuild verified model data and story charts
        run: |
          set -euo pipefail
          python scripts/diagnose_precinct_matching.py
          python scripts/spatial_precinct_overlap.py
          python scripts/model_precinct_surprises.py
          python scripts/build_story_visuals.py
      - name: Run project tests
        run: python -m unittest discover -s tests
      - name: Ensure every referenced report figure is available
        run: |
          test -s reports/figures/how_prediction_works.svg
          test -s reports/figures/explained_model_errors.svg
          test -s reports/figures/census_feature_ablation.svg
          test -s reports/figures/biggest_model_misses.svg
          test -s reports/figures/west_seattle_twin_profile.svg
          test -s reports/figures/twin_case_studies.svg
          test -s reports/figures/fault_line_1709_1724_v2.svg
      - name: Commit verified new report figures to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/figures/how_prediction_works.svg \
                  reports/figures/explained_model_errors.svg \
                  reports/figures/census_feature_ablation.svg \
                  reports/figures/biggest_model_misses.svg \
                  reports/figures/west_seattle_twin_profile.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: include verified reader-friendly story figures"
            git push
          fi

# Regenerate figures for final editorial label corrections.
