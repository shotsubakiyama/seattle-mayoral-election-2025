name: Build illustrated election research draft

on:
  push:
    branches: [feat/election-story-clarity-v2]
    paths:
      - .github/workflows/build-story-figures.yml
      - scripts/build_story_visuals.py
      - tests/test_build_story_visuals.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    name: Regenerate and verify figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Build data and figures from the King County source files
        run: |
          set -euo pipefail
          python scripts/diagnose_precinct_matching.py
          python scripts/spatial_precinct_overlap.py
          python scripts/political_fault_lines.py
          python scripts/render_fault_line_cases.py
          python scripts/model_precinct_surprises.py
          python scripts/precinct_twins.py
          python scripts/precinct_twins_history.py
          python scripts/twin_case_studies.py
          python scripts/build_story_visuals.py
      - name: Run all unit tests
        run: python -m unittest discover -s tests
      - name: Verify every newly generated illustration
        run: |
          test -s reports/figures/how_prediction_works.svg
          test -s reports/figures/explained_model_errors.svg
          test -s reports/figures/biggest_model_misses.svg
          test -s reports/figures/west_seattle_twin_profile.svg
          test -s reports/figures/census_feature_ablation.svg
      - name: Commit only selected editorial SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/figures/how_prediction_works.svg \
                  reports/figures/explained_model_errors.svg \
                  reports/figures/biggest_model_misses.svg \
                  reports/figures/west_seattle_twin_profile.svg \
                  reports/figures/census_feature_ablation.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: add reproducible illustrated election story figures"
            git push
          fi
