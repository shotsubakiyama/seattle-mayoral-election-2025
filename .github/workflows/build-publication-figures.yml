name: Build publication figures

on:
  push:
    branches: [feat/coverage-audit-first-figure]
    paths:
      - .github/workflows/build-publication-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Reproduce election figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install project analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Generate verified inputs and selected figures
        run: |
          set -euo pipefail
          python scripts/diagnose_precinct_matching.py
          python scripts/spatial_precinct_overlap.py
          python scripts/political_fault_lines.py
          python scripts/render_fault_line_cases.py
          python scripts/model_precinct_surprises.py
          python scripts/build_model_scorecard.py
          python scripts/precinct_twins.py
          python scripts/precinct_twins_history.py
          python scripts/twin_case_studies.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Verify all figures used in the article exist
        run: |
          test -s reports/figures/model_comparison_scorecard.svg
          test -s reports/figures/precinct_surprises_scatter.svg
          test -s reports/figures/twin_case_studies.svg
          test -s reports/figures/fault_line_1709_1724_v2.svg
      - name: Commit selected generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/figures/model_comparison_scorecard.svg \
                  reports/figures/precinct_surprises_scatter.svg \
                  reports/figures/twin_case_studies.svg \
                  reports/figures/fault_line_1709_1724_v2.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish verified election research figures"
            git push
          fi
